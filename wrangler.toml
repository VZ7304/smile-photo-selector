name = "smile-photo-selector-api"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-08-19"
workers_dev = true

[build]
command = "npm run build -w @smile/web"

[assets]
directory = "./apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_ENV = "production"
APP_VERSION = "0.2.1"
CORS_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "smile-photo-selector-dev"
database_id = "e08d4779-8841-4fc3-a80b-58706bed942a"
migrations_dir = "migrations"
